<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4d7a">
<title>Una bottiglia, una storia, una festa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter></svg>
<main id="stage" class="stage">
  <canvas id="scene" class="scene" aria-hidden="true"></canvas>
  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <h2 class="intro" id="intro">Una bottiglia,<br>una storia,<br>una festa</h2>

  <button class="bottle-wrap" id="bottle" type="button" aria-label="Apri il messaggio: tocca la bottiglia" disabled>
    <svg class="bottle" viewBox="0 0 100 260" aria-hidden="true">
      <defs>
        <linearGradient id="gb" x1="0" x2="1">
          <stop offset="0" stop-color="#1e463c" stop-opacity=".8"/><stop offset=".08" stop-color="#78b4a5" stop-opacity=".55"/>
          <stop offset=".22" stop-color="#d2f0eb" stop-opacity=".3"/><stop offset=".5" stop-color="#ebfaf8" stop-opacity=".12"/>
          <stop offset=".78" stop-color="#aad7cd" stop-opacity=".28"/><stop offset=".93" stop-color="#46786e" stop-opacity=".6"/>
          <stop offset="1" stop-color="#193c37" stop-opacity=".85"/>
        </linearGradient>
        <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0e0" stop-opacity=".5"/><stop offset="1" stop-color="#2c7fa5" stop-opacity=".55"/></linearGradient>
        <linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#cdb98c"/><stop offset=".45" stop-color="#f7ecd0"/><stop offset="1" stop-color="#bfa878"/></linearGradient>
        <linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#e0b374"/><stop offset=".55" stop-color="#bb8a4e"/><stop offset="1" stop-color="#8f6234"/></linearGradient>
        <pattern id="pc" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="1" fill="#6e4720" opacity=".6"/><circle cx="6.5" cy="6" r=".8" fill="#6e4720" opacity=".5"/><circle cx="5" cy="1" r=".6" fill="#f3d39a" opacity=".6"/></pattern>
        <filter id="soft"><feGaussianBlur stdDeviation="1"/></filter>
        <clipPath id="bc"><path id="bp" d="M32 72C32 50 38 42 38 22h24c0 20 6 28 6 50 20 14 24 34 24 64v100c0 14-10 20-22 20H30c-12 0-22-6-22-20V136c0-30 4-50 24-64z"/></clipPath>
      </defs>
      <g clip-path="url(#bc)">
        <rect x="0" y="158" width="100" height="100" fill="url(#gw)"/>
        <ellipse cx="50" cy="158" rx="42" ry="3.5" fill="#d7f1f7" opacity=".6"/>
        <g class="roll" transform="rotate(-9 50 170)">
          <rect x="37" y="118" width="26" height="100" rx="12" fill="url(#gr)"/>
          <ellipse cx="50" cy="119" rx="13" ry="5" fill="#e9dcb8" stroke="#a89468" stroke-width=".8"/><ellipse cx="50" cy="119" rx="6" ry="2.4" fill="#8f7c52"/>
          <path d="M42 142h16M42 150h12M42 158h16M42 166h10" stroke="#8a7650" stroke-width="1.1" opacity=".7"/>
          <rect x="36" y="175" width="28" height="8" fill="#6fb6d3"/><rect x="36" y="175" width="28" height="8" fill="#000" opacity=".12"/><path d="M50 183l-6 11M50 183l6 11" stroke="#6fb6d3" stroke-width="1.8"/><circle cx="50" cy="179" r="5.2" fill="#c9a24a"/><circle cx="50" cy="179" r="4.2" fill="#f3e9d2"/><image class="mimg" x="46.5" y="175.5" width="7" height="7" preserveAspectRatio="xMidYMid slice"/>
        </g>
        <ellipse cx="50" cy="253" rx="38" ry="6" fill="#fff" opacity=".18"/>
      </g>
      <use href="#bp" fill="url(#gb)"/>
      <use href="#bp" fill="none" stroke="#1d4a40" stroke-opacity=".55" stroke-width="2.6"/>
      <use href="#bp" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width=".9"/>
      <path d="M17 134c0-20 4-32 13-40l-2 126c0 10 1 16 5 20-12-3-16-8-16-20z" fill="#fff" opacity=".7" filter="url(#soft)"/>
      <path d="M81 142c0-9-2-16-5-22 7 9 10 22 10 38v58c0 9-2 14-7 16z" fill="#fff" opacity=".4"/>
      <path d="M41 30c-1 14-1 26-3 38" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".75" fill="none"/>
      <path d="M58 32c1 10 3 18 6 24" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".45" fill="none"/>
      <path d="M14 232c0 8 5 11 12 12" stroke="#fff" stroke-width="1.4" opacity=".5" fill="none" stroke-linecap="round"/>
      <ellipse cx="66" cy="248" rx="16" ry="2.6" fill="#fff" opacity=".3"/>
      <rect x="33" y="17" width="34" height="10" rx="5" fill="#cfece6" fill-opacity=".6" stroke="#fff" stroke-opacity=".85"/>
      <path d="M36 20h28" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      <g class="cork"><rect x="38" y="1" width="24" height="21" rx="4" fill="url(#gc)"/><rect x="38" y="1" width="24" height="21" rx="4" fill="url(#pc)"/><ellipse cx="50" cy="2" rx="12" ry="2.4" fill="#e8c88e"/><path d="M40 5v14" stroke="#fff" stroke-opacity=".3" stroke-width="2"/></g>
    </svg>
  </button>
  <button class="btn tap" id="b-open" type="button" disabled>Apri il messaggio</button>

  <div class="paper-wrap">
    <div class="roll-h top"></div>
    <div class="paper"><p class="t2" id="t2"></p></div>
    <div class="roll-h bot"></div>
    <svg class="ribbon" viewBox="0 0 120 92" aria-hidden="true">
      <defs>
        <linearGradient id="rs" x1="0" x2="1"><stop offset="0" stop-color="#3f86a9"/><stop offset=".25" stop-color="#8cc7de"/><stop offset=".45" stop-color="#e3f4fa"/><stop offset=".7" stop-color="#7fbad4"/><stop offset="1" stop-color="#3a7c9f"/></linearGradient>
        <linearGradient id="rv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05283f" stop-opacity=".55"/><stop offset=".3" stop-color="#fff" stop-opacity=".12"/><stop offset=".7" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#05283f" stop-opacity=".6"/></linearGradient>
        <linearGradient id="rt" x1="0" x2="1"><stop offset="0" stop-color="#4a92b5"/><stop offset=".5" stop-color="#cfeaf5"/><stop offset="1" stop-color="#3d82a5"/></linearGradient>
        <radialGradient id="mg" cx=".35" cy=".3"><stop offset="0" stop-color="#f6e2a0"/><stop offset=".6" stop-color="#c9a24a"/><stop offset="1" stop-color="#8a6a22"/></radialGradient>
        <clipPath id="mc"><circle cx="60" cy="30" r="13"/></clipPath>
      </defs>
      <g class="tails">
        <path class="tl tl-l" d="M58 54C52 66 46 76 38 90l9-2 5 4c4-13 7-25 9-37z" fill="url(#rt)" stroke="#2f6d8e" stroke-width=".5"/>
        <path class="tl tl-r" d="M62 54C68 66 74 76 82 90l-9-2-5 4c-4-13-7-25-9-37z" fill="url(#rt)" stroke="#2f6d8e" stroke-width=".5"/>
      </g>
      <rect x="44" y="9" width="32" height="42" rx="2" fill="url(#rs)" stroke="#2f6d8e" stroke-width=".6"/>
      <rect x="44" y="9" width="32" height="42" rx="2" fill="url(#rv)"/>
      <g class="bow">
        <path class="lp lp-l" d="M60 53C42 40 28 52 35 61c6 6 18-1 25-8z" fill="url(#rt)" stroke="#2f6d8e" stroke-width=".6"/>
        <path class="lp lp-r" d="M60 53c18-13 32-1 25 8-6 6-18-1-25-8z" fill="url(#rt)" stroke="#2f6d8e" stroke-width=".6"/>
        <ellipse class="knot" cx="60" cy="54" rx="5" ry="4.2" fill="url(#rs)" stroke="#2f6d8e" stroke-width=".6"/>
      </g>
      <g class="medal">
        <circle cx="60" cy="30" r="15.5" fill="url(#mg)" stroke="#6b5018" stroke-width=".7"/>
        <circle cx="60" cy="30" r="13" fill="#f3e9d2"/>
        <image class="mimg" x="47" y="17" width="26" height="26" preserveAspectRatio="xMidYMid slice" clip-path="url(#mc)"/>
        <circle cx="60" cy="30" r="13" fill="none" stroke="#8a6a22" stroke-width=".8"/>
        <path d="M49 22a13 13 0 0 1 12-7" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div class="pols" id="pols"></div>
  <p class="t1" id="t1"></p>
  <p class="quote" id="quote"></p>

  <div class="wipe" id="wipe"><div class="wipe-body"></div></div>

  <section class="final" id="final" aria-label="Invito">
    <img id="mono" class="mono" alt="" hidden style="--d:0s">
    <p class="f-title" id="f-title" style="--d:.2s"></p>
    <h1 class="f-name" id="f-name" style="--d:.9s"></h1>
    <p class="f-age" id="f-age" style="--d:1.2s"></p>
    <p class="f-when" id="f-data" style="--d:1.6s"></p>
    <p class="f-when" id="f-ora" style="--d:1.9s"></p>
    <p class="f-place" id="f-locale" style="--d:2.3s"></p>
    <p class="f-addr" id="f-addr" style="--d:2.6s"></p>
    <div class="btns" style="--d:3.1s">
      <a class="btn" id="b-map" target="_blank" rel="noopener" hidden>Come arrivare</a>
      <a class="btn" id="b-wa" target="_blank" rel="noopener" hidden>Conferma presenza</a>
      <button class="btn ghost" id="b-replay" type="button">Riguarda la storia</button>
    </div>
  </section>

  <div class="ui" id="ui" hidden>
    <button class="icon" id="b-sound" type="button" aria-label="Attiva o disattiva l’audio" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button class="skip" id="b-skip" type="button">Vai all’invito</button>
  </div>
</main>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
